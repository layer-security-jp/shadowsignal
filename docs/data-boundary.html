<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ShadowSignalのデータ境界</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100%; min-height: 100%; background: #f5f7fb; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans JP", sans-serif; color: #15233d; }
  .canvas {
    width: 1200px;
    height: 675px;
    padding: 42px 54px;
    background: radial-gradient(circle at 12% 90%, #e8f7f1 0, transparent 29%), #f8faff;
    overflow: hidden;
  }
  .brand { color: #315ec7; font-size: 19px; font-weight: 800; letter-spacing: .13em; }
  h1 { margin: 8px 0 30px; font-size: 40px; line-height: 1.2; letter-spacing: -.035em; }
  .panels { display: grid; grid-template-columns: 1fr 92px 1fr; align-items: stretch; height: 432px; }
  .panel { padding: 31px 34px; border-radius: 24px; background: #fff; }
  .local { border: 3px solid #62bd9b; }
  .remote { border: 3px solid #6f96ee; }
  .panel h2 { margin: 0 0 24px; font-size: 31px; line-height: 1.25; }
  .tag { display: inline-block; margin-bottom: 20px; padding: 7px 15px; border-radius: 999px; font-size: 19px; font-weight: 800; }
  .local .tag { color: #176148; background: #ddf5eb; }
  .remote .tag { color: #274f9f; background: #e3edff; }
  ul { margin: 0; padding: 0; list-style: none; }
  li { position: relative; padding-left: 34px; font-size: 25px; line-height: 1.6; }
  li::before { position: absolute; left: 0; font-weight: 900; }
  .local li::before { content: "✓"; color: #26906a; }
  .remote li::before { content: "•"; color: #3f6fd0; }
  .divider { display: flex; flex-direction: column; justify-content: center; align-items: center; color: #a9404a; }
  .divider .line { width: 0; height: 260px; border-left: 3px dashed #b9c3d5; }
  .divider strong { margin: 10px 0; font-size: 20px; writing-mode: vertical-rl; letter-spacing: .08em; }
  .note {
    margin-top: 20px;
    padding: 14px 20px;
    border-radius: 13px;
    color: #46556d;
    background: #e9eef7;
    font-size: 20px;
    line-height: 1.4;
    text-align: center;
  }
</style>
</head>
<body>
<main class="canvas" role="img" aria-label="ShadowSignalが対象端末内に残す情報とAPIへ送る情報を比較した図">
  <div class="brand">SHADOWSIGNAL DATA BOUNDARY</div>
  <h1>APIへ送るのは、量子化した通信形状だけ</h1>
  <section class="panels">
    <div class="panel local">
      <div class="tag">対象端末内に残る</div>
      <h2>宛先を特定できる情報</h2>
      <ul>
        <li>宛先ホスト・IP・ポート</li>
        <li>プロセス・絶対時刻</li>
        <li>生パケット・一時取得ファイル</li>
        <li>既知AI宛先の判定</li>
      </ul>
    </div>
    <div class="divider"><div class="line"></div><strong>送信しない</strong><div class="line"></div></div>
    <div class="panel remote">
      <div class="tag">APIへ送る</div>
      <h2>通信形状データ</h2>
      <ul>
        <li>ランダムな観測ID</li>
        <li>相対時刻（10ms単位）</li>
        <li>方向（in ／ out）</li>
        <li>サイズ（32B単位）</li>
      </ul>
    </div>
  </section>
  <div class="note">APIは形状判定と同じ観測IDだけを返し、対象端末が宛先情報と結合します。</div>
</main>
</body>
</html>
