<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ShadowSignalの全体構成</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100%; min-height: 100%; background: #f5f7fb; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans JP", sans-serif; color: #15233d; }
  .canvas {
    width: 1200px;
    height: 675px;
    padding: 42px 50px;
    background: radial-gradient(circle at 88% 7%, #e8efff 0, transparent 30%), #f8faff;
    overflow: hidden;
  }
  .brand { color: #315ec7; font-size: 19px; font-weight: 800; letter-spacing: .13em; }
  h1 { margin: 8px 0 30px; font-size: 40px; line-height: 1.2; letter-spacing: -.035em; }
  .diagram { display: grid; grid-template-columns: 720px 96px 284px; height: 490px; }
  .device {
    position: relative;
    padding: 30px 28px 25px;
    border: 3px solid #6f96ee;
    border-radius: 24px;
    background: #fff;
  }
  .zone {
    position: absolute;
    top: -18px;
    left: 25px;
    padding: 7px 17px;
    border-radius: 999px;
    color: #fff;
    background: #315ec7;
    font-size: 20px;
    font-weight: 800;
  }
  .top-flow { display: grid; grid-template-columns: 1fr 54px 1.2fr; align-items: center; }
  .box { padding: 20px 22px; border-radius: 17px; background: #f5f8ff; }
  .box strong { display: block; font-size: 25px; line-height: 1.25; }
  .box span { display: block; margin-top: 8px; color: #5c6980; font-size: 19px; line-height: 1.45; }
  .arrow { color: #4a70bf; font-size: 38px; font-weight: 800; text-align: center; }
  .split { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-top: 19px; }
  .split-box { min-height: 142px; padding: 19px 21px; border-radius: 17px; }
  .send { border: 2px solid #86a9ee; background: #edf4ff; }
  .stay { border: 2px solid #75c7a9; background: #edf9f5; }
  .split-box strong { display: block; font-size: 23px; }
  .split-box p { margin: 9px 0 0; color: #354760; font-size: 20px; line-height: 1.45; }
  .join {
    margin: 18px auto 0;
    padding: 15px 20px;
    width: 82%;
    border-radius: 15px;
    color: #fff;
    background: #18325e;
    font-size: 22px;
    font-weight: 750;
    text-align: center;
  }
  .transit { display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 76px; }
  .transfer { color: #315ec7; font-size: 19px; font-weight: 800; line-height: 1.3; text-align: center; }
  .transfer b { display: block; font-size: 39px; line-height: 1; }
  .return b { transform: rotate(180deg); }
  .api {
    position: relative;
    padding: 54px 27px 28px;
    border-radius: 24px;
    color: #fff;
    background: #192e55;
    box-shadow: 0 16px 38px rgba(21, 40, 78, .14);
  }
  .api .zone { color: #24324a; background: #f5bd5d; }
  .api h2 { margin: 0 0 19px; font-size: 31px; line-height: 1.2; }
  .api-card { padding: 20px; border-radius: 16px; background: #29436f; }
  .api-card + .api-card { margin-top: 16px; }
  .api-card strong { display: block; font-size: 22px; }
  .api-card p { margin: 9px 0 0; color: #e1e8f6; font-size: 19px; line-height: 1.45; }
</style>
</head>
<body>
<main class="canvas" role="img" aria-label="対象端末は宛先情報をローカルに保持し、通信形状データだけをShadowSignal APIへ送り、返された形状判定を端末内で結合する構成図">
  <div class="brand">SHADOWSIGNAL BY LAYER SECURITY</div>
  <h1>宛先情報は端末に残し、通信形状だけAPIへ</h1>
  <section class="diagram">
    <div class="device">
      <div class="zone">対象端末内</div>
      <div class="top-flow">
        <div class="box"><strong>LLMを利用</strong><span>VS Code・ブラウザ・CLI</span></div>
        <div class="arrow">→</div>
        <div class="box"><strong>対象通信を取得</strong><span>OS標準機能で端末内処理</span></div>
      </div>
      <div class="split">
        <div class="split-box send"><strong>API送信用に集約</strong><p>時間・サイズ・頻度の統計</p></div>
        <div class="split-box stay"><strong>端末内に保持</strong><p>宛先・IP・プロセス・絶対時刻</p></div>
      </div>
      <div class="join">APIの統計判定 ＋ 端末内の宛先情報 → 最終表示</div>
    </div>
    <div class="transit">
      <div class="transfer">集約統計<br><b>→</b></div>
      <div class="transfer return">判定結果<br><b>→</b></div>
    </div>
    <div class="api">
      <div class="zone">Layer Security側</div>
      <h2>ShadowSignal API</h2>
      <div class="api-card"><strong>集約統計を判定</strong><p>宛先やプロセスは受信しない</p></div>
      <div class="api-card"><strong>判定結果を返す</strong><p>AIらしい ／ 判定保留 ／ AIらしくない</p></div>
    </div>
  </section>
</main>
</body>
</html>
